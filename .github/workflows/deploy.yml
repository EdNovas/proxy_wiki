name: Deploy Hexo to GitHub Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/FUNDING.yml'
      - 'LICENSE'
      - '**.txt'

  # 允许手动触发部署
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 新推送自动取消正在进行的部署，避免排队堆积
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Hexo 需要完整 git 历史来生成文章日期

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Hexo
        run: npx hexo generate

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
          retention-days: 1  # artifact 只保留 1 天，防止存储堆积

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # 部署完成后清掉 Cloudflare 边缘缓存，让 HTML 可以放心设长 Edge TTL。
  # 需要仓库 Secrets：CF_API_TOKEN（权限 Zone → Cache Purge）、CF_ZONE_ID；未配置时跳过。
  purge-cloudflare:
    runs-on: ubuntu-latest
    needs: deploy
    if: success()
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Purge blog.e.show from Cloudflare cache
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ZONE_ID" ]; then
            echo "CF_API_TOKEN / CF_ZONE_ID 未配置，跳过缓存清理"
            exit 0
          fi
          # 给 GitHub Pages 自身的 CDN 一点时间切换到新版本，避免 Cloudflare 回源时又缓存到旧页面
          sleep 60
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"hosts":["blog.e.show"]}'

  # 自动清理旧的 workflow 运行记录和 artifact，防止存储膨胀
  cleanup:
    runs-on: ubuntu-latest
    needs: deploy
    if: success()
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 7
          keep_minimum_runs: 5
